<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Service Centre Registration - NourishBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        Nourish<span>Bridge</span>
      </a>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#register">Register</a></li>
      </ul>
    </nav>

    <div class="page-content">
      <div class="form-container">
        <div class="form-header">
          <h1>Social Service Centre Registration</h1>
          <p>Join NourishBridge to receive food donations</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="centreRegisterForm">
          <div class="form-group">
            <label for="centreName">Centre Name *</label>
            <input type="text" id="centreName" name="centreName" required placeholder="e.g., Inchara Foundation">
            <span class="error-message" id="centreNameError"></span>
          </div>

          <div class="form-group">
            <label for="contactPerson">Contact Person Name *</label>
            <input type="text" id="contactPerson" name="contactPerson" required placeholder="Enter contact person's name">
            <span class="error-message" id="contactPersonError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="centre@example.com">
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required placeholder="10-digit phone number" maxlength="10">
            <span class="error-message" id="phoneError"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password *</label>
              <input type="password" id="password" name="password" required placeholder="Min 8 characters">
              <span class="error-message" id="passwordError"></span>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password *</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm password">
              <span class="error-message" id="confirmPasswordError"></span>
            </div>
          </div>

          <div class="form-section">
            <h3>Address Details</h3>
            
            <div class="form-group">
              <label for="street">Street Address *</label>
              <input type="text" id="street" name="street" required placeholder="Building, Street name">
            </div>

            <div class="form-group">
              <label for="area">Area / Locality *</label>
              <input type="text" id="area" name="area" required placeholder="e.g., Hampankatta, Kadri">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="Mangalore" readonly>
              </div>
              <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" name="state" value="Karnataka" readonly>
              </div>
            </div>

            <div class="form-group">
              <label for="pincode">Pincode *</label>
              <input type="text" id="pincode" name="pincode" required placeholder="e.g., 575001" maxlength="6">
              <span class="error-message" id="pincodeError"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary form-submit" id="submitBtn">
            Register Centre
          </button>
        </form>

        <p class="form-footer">
          Already registered? <a href="centre_login.html">Login here</a>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>NourishBridge - Serving Mangalore with love and care</p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('centreRegisterForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const alert = document.getElementById('alert');
      const submitBtn = document.getElementById('submitBtn');
      
      // Clear previous errors
      clearErrors();
      
      // Get form values
      const formData = {
        type: 'centre',
        centreName: document.getElementById('centreName').value.trim(),
        contactPerson: document.getElementById('contactPerson').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        address: {
          street: document.getElementById('street').value.trim(),
          area: document.getElementById('area').value.trim(),
          city: document.getElementById('city').value,
          state: document.getElementById('state').value,
          pincode: document.getElementById('pincode').value.trim()
        }
      };
      
      // Validate
      let isValid = true;
      
      if (formData.phone.length !== 10 || !/^\d{10}$/.test(formData.phone)) {
        showError('phoneError', 'Phone number must be exactly 10 digits');
        isValid = false;
      }
      
      if (formData.password.length < 8) {
        showError('passwordError', 'Password must be at least 8 characters');
        isValid = false;
      }
      
      if (formData.password !== document.getElementById('confirmPassword').value) {
        showError('confirmPasswordError', 'Passwords do not match');
        isValid = false;
      }
      
      if (formData.address.pincode.length !== 6 || !/^\d{6}$/.test(formData.address.pincode)) {
        showError('pincodeError', 'Pincode must be exactly 6 digits');
        isValid = false;
      }
      
      if (!isValid) return;
      
      // Submit
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Registering...';
      
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert.className = 'alert alert-success show';
          alert.textContent = 'Registration successful! Redirecting to login...';
          setTimeout(() => {
            window.location.href = 'centre_login.html';
          }, 2000);
        } else {
          alert.className = 'alert alert-error show';
          alert.textContent = result.detail || 'Registration failed. Please try again.';
        }
      } catch (error) {
        alert.className = 'alert alert-error show';
        alert.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Centre';
      }
    });
  </script>
</body>
</html>
